# Render Blueprint for the INLAY free demo deployment — see
# DEMO_DEPLOYMENT.md and RENDER_DEMO_RUNBOOK.md. Two Render Free Web
# Services (Render Free has no free Background Worker plan):
#   - inlay-mvp-demo: Next.js server only (scripts/render-web-entrypoint.mjs).
#   - inlay-demo-worker: one combined process that sequentially handles
#     both file-processing and delivery jobs, with a tiny HTTP
#     health/wake server (src/worker/combined-worker.ts, compiled ahead of
#     time — no tsx at runtime).
#
# No secret values are set here. Configure every secret directly in the
# Render dashboard's Environment tab for each service.
services:
  - type: web
    name: inlay-mvp-demo
    runtime: node
    plan: free
    rootDir: next-app
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    startCommand: npm run start:render-web
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: demo
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_NAME
        value: INLAY
      - key: RUN_DEMO_SEED
        value: "false"
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: RAZORPAY_MODE
        value: test
      - key: PAYOUT_PROVIDER
        value: fake
      - key: PAYOUT_MODE
        value: test
      - key: PLATFORM_FEE_BPS
        value: "200"
      - key: MAX_FILE_SIZE_BYTES
        value: "5242880"
      - key: MAX_WORKSPACE_FILES
        value: "5"
      - key: MAX_WORKSPACE_STORAGE_BYTES
        value: "20971520"
      - key: MAX_IMAGE_DIMENSION
        # 4000px rejected common phone-camera photos (e.g. a standard
        # iPhone photo is 3024x4032 — 32px over the old limit), causing
        # legitimate image uploads to fail processing in production. 6000px
        # comfortably covers phone/DSLR resolutions while still bounding
        # Sharp's decode memory well under the code default (8000px).
        value: "6000"
      - key: PREVIEW_MAX_DIMENSION
        value: "1200"
      - key: MAX_DELIVERY_BUNDLE_BYTES
        value: "20971520"
      - key: DOWNLOAD_GRANT_TTL_SECONDS
        value: "604800"
      - key: DOWNLOAD_GRANT_MAX_DOWNLOADS
        value: "5"
      # --- Set these manually in the Render dashboard (secrets/deployment-specific) ---
      # AUTH_URL, AUTH_SECRET, AUTH_TRUST_HOST
      # DATABASE_URL, DIRECT_URL (Neon)
      # S3_ENDPOINT, S3_REGION, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
      # NEXT_PUBLIC_RAZORPAY_KEY_ID, RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET
      # WORKER_WAKE_URL (https://inlay-demo-worker.onrender.com/wake), WORKER_WAKE_SECRET
      # (WORKER_WAKE_SECRET must be the same value set on inlay-demo-worker below)
      - key: AUTH_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: WORKER_WAKE_URL
        sync: false
      - key: WORKER_WAKE_SECRET
        sync: false

  - type: web
    name: inlay-demo-worker
    runtime: node
    plan: free
    rootDir: next-app
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build:worker
    startCommand: npm run start:render-worker
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: demo
      - key: NODE_ENV
        value: production
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: FILE_WORKER_CONCURRENCY
        value: "1"
      - key: DELIVERY_WORKER_CONCURRENCY
        value: "1"
      - key: SHARP_CONCURRENCY
        value: "1"
      - key: MAX_FILE_SIZE_BYTES
        value: "5242880"
      - key: MAX_WORKSPACE_STORAGE_BYTES
        value: "20971520"
      - key: MAX_DELIVERY_BUNDLE_BYTES
        value: "20971520"
      - key: PREVIEW_MAX_DIMENSION
        value: "1200"
      # --- Set these manually in the Render dashboard (secrets/deployment-specific) ---
      # DATABASE_URL (Neon)
      # S3_ENDPOINT, S3_REGION, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
      # WORKER_WAKE_SECRET (same value as inlay-mvp-demo above)
      # PORT is provided automatically by Render — do not set it manually.
      - key: DATABASE_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: WORKER_WAKE_SECRET
        sync: false
